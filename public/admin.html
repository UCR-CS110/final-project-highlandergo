<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highlander GO — Admin</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <span class="admin-brand">Highlander GO — Admin Panel</span>
      <a href="/" class="admin-home-link">Back to Dashboard</a>
    </header>

    <main class="admin-main">
      <div id="admin-status" class="admin-status hidden"></div>

      <section class="admin-section">
        <h2 class="admin-section-title">Spots <span id="spot-count" class="admin-count"></span></h2>
        <div id="spots-table-wrap">
          <p class="admin-loading">Loading spots…</p>
        </div>
      </section>

      <section class="admin-section">
        <h2 class="admin-section-title">Comments <span id="comment-count" class="admin-count"></span></h2>
        <div id="comments-table-wrap">
          <p class="admin-loading">Loading comments…</p>
        </div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
