<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highlander GO - Campus Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/map.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="navbar-brand" >Highlander GO</a>
      <div class="navbar-links">
        <a href="/user_profile/profile.html">Profile</a>
      </div>
    </nav>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      async function fetchWithCsrf(url, options = {}) {
        const { token } = await fetch("/api/csrf-token").then((r) => r.json());
        return fetch(url, {
          ...options,
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "x-csrf-token": token,
            ...(options.headers || {}),
          },
        });
      }
    </script>

    <div id="map-filter">
      <span class="filter-title">Filter by Category</span>
      <button class="filter-btn active" data-category="food">Food</button>
      <button class="filter-btn active" data-category="study">Study</button>
      <button class="filter-btn active" data-category="other">Other</button>
    </div>

    <script src="/map.js"></script>
    <div id="reviews-sidebar" class="reviews-sidebar hidden"></div>
  </body>
</html>
